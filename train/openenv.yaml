name: pandemic-policy-control
version: "1.0.0"
description: >
  A reinforcement learning environment where an AI agent plays the role
  of a government health authority making daily non-pharmaceutical intervention
  (NPI) decisions during a pandemic. The agent must balance epidemic suppression
  and economic stability across a simulated COVID-19 outbreak calibrated to
  US data (from May 2020 to Oct 2022).
  [Inspried by the SIR-RL framework (arXiv:2404.08423v1).]

tags:
  - openenv
  - pandemic
  - public-health
  - policy
  - epidemiology
  - economics
  - SIR-model
  - multi-objective

domain: public-health-policy

tasks:
  - name: flatten_curve
    difficulty: easy
    max_steps: 180
    description: >
      Keep the infected fraction below 0.3% (hospital overflow threshold)
      for the first 180 days of the epidemic.
    score_range: [0.0, 1.0]
    success_threshold: 0.85

  - name: balanced_response
    difficulty: medium
    max_steps: 365
    description: >
      Over a full year, keep Re below 1.5 AND maintain GDP above 92
      simultaneously. Scored via harmonic mean of health and economic rates.
    score_range: [0.0, 1.0]
    success_threshold: 0.70

  - name: optimal_transition
    difficulty: hard
    max_steps: 365
    description: >
      Full 365-day episode requiring: pre-vaccine suppression (Re < 1.0),
      smooth vaccine rollout transition, economic recovery post-vaccine,
      and no hospital overflow throughout.
    score_range: [0.0, 1.0]
    success_threshold: 0.60

observation_space:
  type: continuous
  fields:
    susceptible:          "float [0,1] — fraction of population susceptible"
    infected:             "float [0,1] — fraction currently infected"
    recovered:            "float [0,1] — fraction recovered/immune"
    re:                   "float ≥ 0 — effective reproduction number"
    new_cases_norm:       "float ≥ 0 — new cases as fraction of population"
    weekly_growth_rate:   "float — week-on-week growth rate of infected"
    gdp_index:            "float [0,100] — normalized GDP index"
    stringency_index:     "float [0,100] — composite policy stringency"
    vaccinated_pct:       "float [0,100] — % population with first dose"
    fully_vaccinated_pct: "float [0,100] — % population fully vaccinated"
    day:                  "int — day index since episode start"
    phase:                "str — pre_vaccine | rollout | endemic"

action_space:
  type: multi_discrete
  fields:
    school_closing:              {range: [0,3], description: "School closure level"}
    workplace_closing:           {range: [0,3], description: "Workplace closure level"}
    cancel_public_events:        {range: [0,2], description: "Public event cancellation"}
    restrictions_on_gatherings:  {range: [0,4], description: "Gathering size restrictions"}
    close_public_transport:      {range: [0,2], description: "Public transport closure"}
    stay_at_home:                {range: [0,3], description: "Stay-at-home requirements"}
    internal_movement:           {range: [0,2], description: "Internal movement restrictions"}
    international_travel:        {range: [0,4], description: "International travel controls"}
    facial_coverings:            {range: [0,4], description: "Facial covering policy"}
    vaccination_policy:          {range: [0,5], description: "Vaccination availability"}
    income_support:              {range: [0,2], description: "Income support level"}
    debt_relief:                 {range: [0,2], description: "Debt/contract relief"}

reward:
  type: dense
  range: [-50, 30]
  components:
    health_component:    "Based on Re relative to thresholds 1.25 and 1.5"
    economic_component:  "Based on GDP index (cubic polynomial of stringency)"
    stability_component: "Penalty for large day-to-day stringency changes"
    support_component:   "Bonus for economic support during high stringency"
    threshold_penalty:   "-20 if infected > 0.3%, +5 otherwise"

endpoints:
  reset: "POST /reset"
  step:  "POST /step"
  state: "GET  /state"
  grade: "POST /grade"

authors:
  - name: "Pandemic Policy Control Team"

license: MIT