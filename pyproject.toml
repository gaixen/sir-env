
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaler"
version = "0.1.0"
description = "Epidemic policy simulation, training and OpenEnv-compatible runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Soham Mukherjee", email = "sohamjee1447@gmail.com" }]
keywords = ["epidemic", "simulation", "reinforcement-learning", "openenv"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
    "scipy>=1.10",
    "gymnasium>=0.27",
    "stable-baselines3>=2.0",
    "torch>=2.1",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scikit-learn>=1.2",
    "fastapi>=0.95",
    "pydantic>=2.0",
    "uvicorn>=0.22",
    "openenv-core>=0.2.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
polars = ["polars>=0.18"]
owid = ["owid-catalog>=0.1"]

[tool.setuptools]
packages = ["train", "train.environment", "train.fitting", "data", "server"]
